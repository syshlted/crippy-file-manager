# Single source of truth for dependency versions.
#
# The toolchain is encri's and encri-api's, version for version (AGENTS.md F1): this app builds
# against encri-client, which builds against the same Kotlin and AGP, so a bump is made in all three
# repositories together or not at all.

[versions]
agp = "9.4.1"
# Newer than the 2.2.10 AGP 9.4.1 depends on, which has a build-cache deserialization flaw fixed in
# 2.4.20 (GHSA-r937-wjx7-w2jp). On the root classpath, so AGP's built-in Kotlin compiles with it too
# (encri D119, encri-api L9).
kotlin = "2.4.21"
ktlint = "1.8.0"
ktlintPlugin = "14.2.0"
detekt = "1.23.8"
kover = "0.9.9"
junit = "5.14.4"
# A real Activity, Looper and resources off a device, which is what lets the coverage gate measure
# the screens rather than exclude them (F1).
robolectric = "4.17"
# The client's API is suspend functions and a SharedFlow (encri-api L12), so coroutines arrive with
# it; the Android module is the one that gives them a main thread to run on.
coroutines = "1.10.2"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"

# minSdk 27, encri's floor (encri D14) and therefore the lowest level the file manager can ever find
# encri on (encri-api L1).
minSdk = "27"
compileSdk = "36"
targetSdk = "36"

[libraries]
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
# The client library, which is the only way this app reaches the vault (encri D112). Substituted by the
# included build in settings.gradle.kts until it is published; the version is the included build's own.
encri-client = { module = "com.systemhalted.encri:encri-client", version = "0.1.0-SNAPSHOT" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
junit4 = { module = "junit:junit", version = "4.13.2" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintPlugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
